<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор рассрочки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee;--surface:#ffffff;--ink:#101312;--muted:#5f6b67;--line:#101312;
  --yellow:#ffd21f;--green:#0e9f5b;--green-deep:#07703f;
  --disp:"Unbounded","Arial Black","Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b0e0d;--surface:#161b19;--ink:#f2f5f3;--muted:#94a29d;--line:#f2f5f3;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b0e0d;--surface:#161b19;--ink:#f2f5f3;--muted:#94a29d;--line:#f2f5f3;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 14px 48px}
h1{font:800 1.05rem/1.2 var(--disp);margin:0 0 14px;letter-spacing:-.01em}
.price{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 16px 14px;box-shadow:5px 5px 0 var(--yellow)}
.price label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}
.field{display:flex;align-items:baseline;gap:8px}
#amount{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:900 2.3rem/1.2 var(--disp);padding:0}
#amount::placeholder{color:var(--muted);opacity:.35}
.cur{font:600 1rem var(--disp);color:var(--muted)}
.price:focus-within{box-shadow:5px 5px 0 var(--green)}
section{margin-top:22px;border-radius:26px;padding:14px 12px 4px;position:relative;overflow:hidden}
section.zero{background:radial-gradient(circle at 100% 0,#fff3a8 0,transparent 55%),var(--yellow);color:#111}
section.mplus{background:radial-gradient(circle at 100% 0,#ffd21f 0,transparent 38%),linear-gradient(160deg,var(--green),var(--green-deep));color:#fff}
section>header{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 12px}
section h2{margin:0;font:900 2.1rem/1 var(--disp);letter-spacing:-.03em}
.badge{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px}
.zero .badge{background:#fff;color:#111}
.mplus .badge{background:var(--yellow);color:#111}
.row{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:#fff;color:#111;border-radius:18px;padding:12px 14px;margin-bottom:10px}
.term{font:800 .95rem/1.1 var(--disp);padding:8px 12px;border-radius:12px;white-space:nowrap}
.zero .term{background:#111;color:var(--yellow)}
.mplus .term{background:var(--green);color:#fff}
.term span{display:block;font:600 .72rem var(--disp);opacity:.85;margin-top:3px}
.total{font:900 1.55rem/1.1 var(--disp);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mplus .total{color:var(--green-deep)}
section.paida{background:radial-gradient(circle at 100% 0,#ff6a6a 0,transparent 45%),linear-gradient(160deg,#e4122b,#a80b1c);color:#fff}
.paida h2{font-size:1.7rem;letter-spacing:-.02em}
section>header{min-height:3rem}
.paida .badge{background:#111;color:#fff}
.paida .term{background:#e4122b;color:#fff}
.paida .total{color:#c40d22}
.sub{grid-column:1/-1;margin-top:6px;padding-top:6px;border-top:2px dashed #d9d9d9;color:#4a4f4d;font-size:.86rem;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.empty{background:rgba(255,255,255,.6);color:#111;border-radius:18px;padding:14px;margin-bottom:10px}
button.copy{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;width:100%}
button.copy:focus-visible{outline:3px solid #111;outline-offset:3px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:#111;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid #111;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
footer{text-align:center;color:var(--muted);font-size:.72rem;padding:0 14px 26px}
@media (min-width:860px){
  main{max-width:1100px;padding:36px 32px 64px}
  h1{font-size:1.5rem;margin-bottom:18px}
  .price{max-width:620px;padding:16px 22px 18px}
  #amount{font-size:3.2rem}
  #out{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:start;margin-top:28px}
  section{margin-top:0;padding:20px 18px 8px;border-radius:30px}
  section h2{font-size:2.8rem}
    section>header{min-height:3.7rem}
  .row{padding:16px 18px}
  .term{font-size:1.1rem}
  .total{font-size:1.6rem}
}
@media (min-width:1400px){html{font-size:20px}main{max-width:1280px}}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Калькулятор рассрочки</h1>
  <div class="price">
    <label for="amount">Цена товара</label>
    <div class="field">
      <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="">
      <span class="cur">сом</span>
    </div>
  </div>
  <div id="out"></div>
</main>
<footer>made by Dastan Jeenbekov</footer>
<div id="toast" role="status" aria-live="polite">Скопировано</div>
<script>
// Ставки: срок (мес) -> процент по обратному расчёту. Итог = цена / (1 - процент/100).
var PLANS = [
  {id:"zero", name:"ZERO", bank:"Айыл банк", rates:[{m:3,p:5},{m:6,p:10},{m:12,p:15}]},
  {id:"paida", name:"Пайда!", bank:"Optima Bank", rates:[{m:3,p:5},{m:6,p:10},{m:12,p:15}]},
  {id:"mplus", name:"M+", bank:"М-банк", rates:[{m:3,p:5}]}
];
var input = document.getElementById("amount");
var out = document.getElementById("out");
var toast = document.getElementById("toast");
var timer;
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0"); }
function digits(s){ return s.replace(/\D/g, ""); }
function render(){
  var v = parseInt(digits(input.value), 10);
  var html = "";
  PLANS.forEach(function(plan){
    html += '<section class="'+plan.id+'"><header><h2>'+plan.name+'</h2><span class="badge">'+plan.bank+'</span></header>';
    if (!v){
      html += '<div class="empty">Введите цену, чтобы увидеть расчёт.</div>';
    } else {
      plan.rates.forEach(function(r){
        var total = v / (1 - r.p/100);
        html += '<div class="row"><div class="term">'+r.m+' мес<span>'+(r.note ? r.note+' · ' : '')+r.p+'%</span></div>'
          + '<button class="copy" data-copy="'+Math.round(total)+'" aria-label="Скопировать итог '+fmt(total)+' сом"><div class="total">'+fmt(total)+'</div></button>'
          + '<div class="sub"><span>'+fmt(total / r.m)+' в месяц</span><span>наценка '+fmt(total - v)+'</span></div></div>';
      });
    }
    html += '</section>';
  });
  out.innerHTML = html;
}
input.addEventListener("input", function(){
  var d = digits(input.value).slice(0, 9);
  input.value = d ? fmt(parseInt(d, 10)) : "";
  render();
});
out.addEventListener("click", function(e){
  var b = e.target.closest("button.copy");
  if (!b) return;
  try { navigator.clipboard.writeText(b.getAttribute("data-copy")); } catch(err) {}
  toast.classList.add("on");
  clearTimeout(timer);
  timer = setTimeout(function(){ toast.classList.remove("on"); }, 1200);
});
render();
</script>
</body>
</html>
